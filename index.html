<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inbox (1) - Mail</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f6f8fc}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}.top{height:65px;display:flex;align-items:center;gap:22px;padding:0 24px}.brand{font-size:23px;color:#5f6368;min-width:225px}.brand span{color:#4285f4}.search{background:#eaf1fb;border-radius:24px;padding:15px 20px;flex:1;max-width:690px;color:#667085;font-size:14px}.profile{margin-left:auto;background:#375a7f;color:white;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:14px}.layout{display:flex;min-height:calc(100vh - 65px)}aside{width:250px;padding:15px 12px;flex-shrink:0}.compose{background:#c2e7ff;border:0;border-radius:17px;padding:17px 24px;margin-bottom:20px;font-weight:bold}.folder{padding:10px 18px;border-radius:0 20px 20px 0;color:#4c5057;font-size:14px}.folder.active{background:#d3e3fd;color:#001d35;font-weight:bold}main{background:white;border-radius:18px 18px 0 0;flex:1;margin-right:16px;min-width:0;overflow:hidden}.toolbar{padding:20px 22px;border-bottom:1px solid #eee;color:#666;font-size:14px}.tabs{display:flex;border-bottom:1px solid #e9eaed}.tab{padding:17px 25px;color:#555;font-size:14px;min-width:170px}.tab.active{border-bottom:3px solid #0b57d0;color:#0b57d0;font-weight:bold}.mail{display:grid;grid-template-columns:30px 30px minmax(110px,185px) minmax(0,1fr) 75px;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid #e6e8eb;background:#f2f6fc;font-size:14px;color:#555;min-height:43px}.mail.unread{background:white;color:#202124;font-weight:bold;box-shadow:inset 0 -1px #ddd;cursor:pointer}.mail.unread:hover{box-shadow:inset 0 0 0 1px #d2d6dc;background:#f8faff}.subject{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{color:#777;font-weight:normal}.date{text-align:right;font-size:12px}.message{padding:26px 36px;max-width:850px}.back{border:0;background:transparent;color:#444;padding:8px 12px;margin:-8px 0 18px -12px}.message h2{font-size:23px;font-weight:400;margin:5px 0 25px}.sender{display:flex;align-items:center;gap:12px;margin-bottom:34px}.avatar{width:39px;height:39px;background:#64748b;color:white;border-radius:50%;display:grid;place-items:center}.sender small{color:#777}.body{font-size:15px;line-height:1.9;max-width:650px}.body a{color:#1155cc}.body p{margin-bottom:18px}.muted{color:#777}.notice{margin-top:35px;font-size:12px;color:#8a8f98}@media(max-width:720px){aside{display:none}.brand{min-width:auto}.search{display:none}main{margin:0;border-radius:0}.mail{grid-template-columns:18px minmax(80px,120px) minmax(0,1fr) 45px;padding:12px 8px}.mail .star{display:none}.tab{min-width:0;flex:1;padding:15px 12px}.message{padding:22px}.top{padding:0 15px}}
</style>
</head>
<body>
<header class="top"><div class="brand">✉ Gmail</div><div class="search">⌕ &nbsp; Search mail</div><div class="profile">P</div></header>
<div class="layout"><aside><button class="compose" type="button">✎ &nbsp; Compose</button><div class="folder active">▣ &nbsp; Inbox &nbsp; <strong>1</strong></div><div class="folder">☆ &nbsp; Starred</div><div class="folder">◷ &nbsp; Snoozed</div><div class="folder">➤ &nbsp; Sent</div><div class="folder">▤ &nbsp; Drafts</div><div class="folder">⌄ &nbsp; More</div></aside><main id="main"><div class="toolbar">☐ &nbsp; ⟳ &nbsp; ⋮ <span style="float:right">1–6 of 6</span></div><div class="tabs"><div class="tab active">▣ &nbsp; Primary</div><div class="tab">◉ &nbsp; Promotions</div><div class="tab">☷ &nbsp; Social</div></div><div id="inbox"></div></main></div>
<script>
const emails=[
 {from:'Unknown Sender',subject:'The records are lying.',preview:'The King is dead. But the archives tell a different story...',date:'2:17 AM',special:true},
 {from:'Tristan Eng [Student]',subject:'Modern impacts of Hegemony',preview:'Take a look at this Mr Husainy',date:'Yesterday'},
 {from:'Wealth Simple',subject:'Money money money',preview:'You have made more than $67 today!',date:'Oct 24'},
 {from:'Nintendo',subject:'The Legend of Zelda',preview:'Breath of the Wild',date:'Oct 22'},
 {from:'Tristan Eng [Student]',subject:'Critical conciousness!!!1',preview:'Thinking in the space',date:'Oct 19'},
 {from:'Jerry Cui [Student]',subject:'Death Threat',preview:'im gonna get u!!!!!!!',date:'Oct 17'}
];
function renderInbox(){document.title='Inbox (1) - Mail';const inbox=document.getElementById('inbox');inbox.replaceChildren();for(const email of emails){const row=document.createElement('div');row.className='mail'+(email.special?' unread':'');const check=document.createElement('span');check.textContent='☐';const star=document.createElement('span');star.textContent='☆';star.className='star';const sender=document.createElement('span');sender.textContent=email.from;const subj=document.createElement('span');subj.className='subject';const strong=document.createElement('span');strong.textContent=email.subject+' — ';const preview=document.createElement('span');preview.className='preview';preview.textContent=email.preview;subj.append(strong,preview);const date=document.createElement('span');date.className='date';date.textContent=email.date;row.append(check,star,sender,subj,date);if(email.special){row.tabIndex=0;row.setAttribute('role','button');row.setAttribute('aria-label','Open message from Unknown Sender');row.addEventListener('click',openMessage);row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMessage()}})}inbox.append(row)}}
function openMessage(){document.title='The records are lying. - Mail';const main=document.getElementById('main');main.replaceChildren();const wrap=document.createElement('div');wrap.className='message';const back=document.createElement('button');back.className='back';back.textContent='← Back to Inbox';back.addEventListener('click',()=>location.reload());const title=document.createElement('h2');title.textContent='The records are lying.';const sender=document.createElement('div');sender.className='sender';sender.innerHTML='<div class="avatar">?</div><div><strong>Unknown Sender</strong><br><small>to me · 2:17 AM</small></div>';const body=document.createElement('div');body.className='body';const lines=['The King is dead.','The official records say it was an accident.','But history has been rewritten. Someone made sure of that.','If you want to know what really happened, go back to the beginning.','Find what they erased.'];for(const line of lines){const p=document.createElement('p');p.textContent=line;body.append(p)}const p=document.createElement('p');const link=document.createElement('a');link.href='archive.html';link.textContent='Access the archived website';p.append(link);body.append(p);const sign=document.createElement('p');sign.textContent='— H';body.append(sign);const notice=document.createElement('div');notice.className='notice';notice.textContent='This is a fictional inbox created for the Hamlet Archives interactive game.';wrap.append(back,title,sender,body,notice);main.append(wrap)}
renderInbox();
</script>
</body>
</html>

</script>
</body>
</html>
