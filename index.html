<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox (6) - Mail</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f6f8fc}*{box-sizing:border-box}body{margin:0}.top{height:70px;display:flex;align-items:center;gap:20px;padding:12px 24px}.logo{font-size:23px;color:#5f6368;min-width:220px}.logo b{color:#d34d45}.search{background:#eaf1fb;border-radius:28px;padding:14px 20px;flex:1;max-width:690px;color:#5f6368}.shell{display:flex;min-height:calc(100vh - 70px)}aside{width:240px;padding:15px;flex-shrink:0}.compose{background:#c2e7ff;border-radius:16px;padding:18px;width:145px;font-weight:bold;margin-bottom:24px}.nav{padding:12px 18px;border-radius:0 22px 22px 0}.active{background:#d3e3fd;font-weight:bold}main{background:white;border-radius:18px 18px 0 0;flex:1;min-width:0;margin-right:16px;padding:20px 0}.toolbar{padding:8px 24px 20px;border-bottom:1px solid #eee;color:#5f6368;font-size:14px}.mail{display:grid;grid-template-columns:26px 28px minmax(160px,275px) 1fr 80px;align-items:center;gap:10px;padding:13px 24px;border-bottom:1px solid #e8eaed;font-size:15px;background:#f1f5fb;min-height:55px}.mail.read{background:white;color:#5f6368}.mail.special{cursor:pointer;font-weight:bold}.mail.special:hover{box-shadow:inset 0 0 0 1px #dadce0,0 2px 4px #0002}.snippet{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.date{text-align:right;font-size:12px}.detail{padding:10px 38px;max-width:850px}.back{border:0;background:none;color:#5f6368;font-size:22px;cursor:pointer;padding:8px 12px;margin-bottom:20px}.subject{font-size:25px;font-weight:400;margin:0 0 25px}.sender{display:flex;gap:14px;align-items:center;margin-bottom:35px}.avatar{width:40px;height:40px;border-radius:50%;background:#747d89;color:white;display:grid;place-items:center}.sender small{display:block;color:#777;margin-top:4px}.bodytext{line-height:1.9;font-size:15px;margin-left:54px}.attachment{margin:30px 0 0 54px;border:1px solid #dadce0;border-radius:12px;display:flex;align-items:center;gap:15px;padding:18px;max-width:390px;text-decoration:none;color:#202124}.attachment:hover{background:#f1f5fb;border-color:#8ab4f8}.fileicon{background:#e8f0fe;padding:14px;border-radius:8px;color:#1967d2}.attachment small{display:block;color:#666;margin-top:5px}.foot{margin:45px 0 0 54px;color:#999;font-size:11px}button:focus-visible,a:focus-visible{outline:3px solid #1967d2;outline-offset:3px}@media(max-width:700px){aside{display:none}.top{padding:10px}.logo{min-width:0;font-size:18px}.search{font-size:12px}.mail{grid-template-columns:18px minmax(80px,110px) 1fr 55px;padding:14px 10px;gap:6px}.star{display:none}.detail{padding:10px 20px}.bodytext,.attachment,.foot{margin-left:0}main{margin-right:0}}
</style>
</head>
<body>
<header class="top"><div class="logo"><b>✉</b> Gmail</div><div class="search">⌕ &nbsp; Search mail</div><span aria-hidden="true">⚙</span></header>
<div class="shell"><aside><div class="compose">✎ &nbsp; Compose</div><div class="nav active">▣ &nbsp; Inbox &nbsp; 1</div><div class="nav">☆ &nbsp; Starred</div><div class="nav">◷ &nbsp; Snoozed</div><div class="nav">➤ &nbsp; Sent</div><div class="nav">▤ &nbsp; Drafts</div></aside>
<main id="app"><div class="toolbar">☐ &nbsp; ↻ &nbsp; ⋮ &nbsp;&nbsp;&nbsp; Primary</div><div id="inbox"></div></main></div>
<script>
const messages=[
{from:'Unknown Sender',subject:'The records are lying.',preview:'You know how the story ends. But do you know who told it?',date:'2:17 AM',special:true},
{from:'Tristan Eng [Student]',subject:'Modern impacts of Hegemony',preview:'Take a look at this Mr Husainy',date:'Yesterday'},
{from:'Wealth Simple',subject:'Money money money',preview:'You have made more than $67 today!',date:'Yesterday'},
{from:'Nintendo',subject:'The Legend of Zelda',preview:'Breath of the Wild',date:'Mon'},
{from:'Tristan Eng [Student]',subject:'Critical consciousness!!!1',preview:'Thinking in the space',date:'Mon'},
{from:'Jerry Cui [Student]',subject:'Death Threat',preview:'im gona get u!!!!!!!',date:'Sun'}
];
const app=document.getElementById('app');
function showInbox(){
app.innerHTML='<div class="toolbar">☐ &nbsp; ↻ &nbsp; ⋮ &nbsp;&nbsp;&nbsp; Primary</div><div id="inbox"></div>';
const list=document.getElementById('inbox');
messages.forEach(m=>{
const row=document.createElement(m.special?'button':'div');row.className='mail '+(m.special?'special':'read');
if(m.special){row.type='button';row.style.width='100%';row.style.border='0';row.style.textAlign='left';row.setAttribute('aria-label','Open email from Unknown Sender');row.onclick=showMessage;}
const checkbox=document.createElement('span');checkbox.textContent='☐';
const star=document.createElement('span');star.className='star';star.textContent='☆';
const sender=document.createElement('span');sender.textContent=m.from;
const snippet=document.createElement('span');snippet.className='snippet';snippet.textContent=m.subject+' — '+m.preview;
const date=document.createElement('span');date.className='date';date.textContent=m.date;
row.append(checkbox,star,sender,snippet,date);list.appendChild(row);
});}
function showMessage(){
app.innerHTML=`<div class="detail"><button class="back" id="back" aria-label="Back to inbox">←</button><h1 class="subject">The records are lying.</h1><div class="sender"><div class="avatar">?</div><div><strong>Unknown Sender</strong><small>unknown@unlisted.invalid · to me</small></div></div><div class="bodytext"><p>You know how the story ends.</p><p>The prince. The king. The poisoned court.</p><p>But there is something you were never meant to find.</p><p>Seven records. One survivor. One story.</p><p>Go back to the beginning.</p><p>— Unknown</p></div><a class="attachment" href="archive.html"><span class="fileicon">▤</span><span><strong>elsinore_archive.url</strong><small>Archived website shortcut · Open file ↗</small></span></a><div class="foot">This is a fictional inbox created for the Hamlet Archives game.</div></div>`;
document.getElementById('back').onclick=showInbox;
}
showInbox();
</script>
</body>
</html>
